services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gouden_draak_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    environment:
      # Local Docker defaults. Override these per OTAP environment in the matching .env file.
      TMPDIR: /var/www/html/storage/tmp

      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-gouden_draak}
      DB_USERNAME: ${DB_USERNAME:-gouden_draak}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: gouden_draak_mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-gouden_draak}
      MYSQL_USER: ${DB_USERNAME:-gouden_draak}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: gouden_draak_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql

volumes:
  mysql_data:
